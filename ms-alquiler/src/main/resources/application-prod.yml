# Perfil de producción: valida el esquema y no muestra SQL.
# Requiere definir DB_URL, DB_USER y DB_PASSWORD en el entorno.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    root: INFO
    com.tecsup.alquiler: INFO
