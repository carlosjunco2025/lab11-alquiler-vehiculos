server:
  port: ${PORT:8083}

spring:
  application:
    name: ms-alquiler
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    username: ${DB_USER:lab11_user}
    password: ${DB_PASSWORD:lab11_pass}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# URLs de los otros microservicios. Se pueden cambiar por variables de entorno
# sin recompilar (por ejemplo, si se despliegan en otro host).
clientes:
  url: ${MS_CLIENTE_URL:http://localhost:8081}
vehiculos:
  url: ${MS_VEHICULO_URL:http://localhost:8082}
